# Ace6 module source overrides (device-repository side).
#
# Per the UniXNU configuration reference:
#   "Build inputs use unixnu.local.toml; module source overrides use the
#    device repository's local.toml."
#
# Unlike the 13T repository this one keeps drivers/ and kits/ inline instead of
# a modules/<name> submodule, so the local paths point at this repository.
# Remove this file to fall back to the pinned submodule sources.

[[source]]
name = "sm8750"
kind = "soc"
local = "../UniXNU-sm8750-common"

[local]
drivers = "../UniXNU-ace6/drivers"
kits = "../UniXNU-ace6/kits"
