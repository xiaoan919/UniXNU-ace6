name: Ace6 PLQ110 XNU

# 云端构建，不依赖本机 macOS / Linux。
# 从 13T 的 xnu.yml 派生，改为 Ace6 (PLQ110) 的路径与标识。

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过契约测试（仅快速验证工具链）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ace6-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
          persist-credentials: false

      # The drivers and kits arrive as three submodules, because the configuration
      # check runs "git -C <module.path> rev-parse HEAD" and requires the revision
      # pinned in components.toml. Files copied into the device repository have no
      # .git of their own, so that check would read the device repository HEAD.
      #
      # The three do not share one layout, so link each component into the flat
      # drivers/ and kits/ directories the driver expects. Symlinks keep git
      # scoping: git -C follows the link and finds the submodule .git above it.
      - name: Link submodule components into drivers and kits
        working-directory: device
        run: |
          set -eu
          # The drivers/ and kits/ links live inside device/, so a target must be
          # relative to device/drivers/NAME, where one ../ reaches device/.
          # Writing ../../modules/... instead escapes to the repository root and
          # every link dangles.
          mkdir -p drivers kits
          for d in modules/Pagani/drivers/*; do
            [ -d "$d" ] || continue
            ln -sfn "../$d" "drivers/$(basename "$d")"
          done
          for d in modules/Pagani/kits/*; do
            [ -d "$d" ] || continue
            ln -sfn "../$d" "kits/$(basename "$d")"
          done
          ln -sfn "../modules/Sm8750Platform/kits/Sm8750Platform" kits/Sm8750Platform
          ln -sfn "../modules/QcomGeniSpi" drivers/QcomGeniSpi
          echo "--- drivers ---"
          ls -1 drivers
          echo "--- kits ---"
          ls -1 kits
          echo "--- resolve check ---"
          for n in BootProgress PaganiInput NativeUfs QcomGeniSpi; do
            test -e "drivers/$n" || { echo "dangling: drivers/$n"; exit 1; }
            echo "ok drivers/$n -> $(readlink "drivers/$n")"
          done
          for n in NativePrelink PaganiVerifiedRoot Sm8750Platform; do
            test -e "kits/$n" || { echo "dangling: kits/$n"; exit 1; }
            echo "ok kits/$n -> $(readlink "kits/$n")"
          done
          test -f drivers/BootProgress/BootProgress.c
          echo "BootProgress.c reachable through the link"

      - name: Link submodule components into drivers and kits
        working-directory: device
        run: |
          set -eu
          mkdir -p drivers kits
          for d in modules/Pagani/drivers/*; do ln -sfn "../../$d" "drivers/$(basename "$d")"; done
          for d in modules/Pagani/kits/*; do ln -sfn "../../$d" "kits/$(basename "$d")"; done
          ln -sfn "../../modules/Sm8750Platform/kits/Sm8750Platform" kits/Sm8750Platform
          ln -sfn "../../modules/QcomGeniSpi" drivers/QcomGeniSpi
          ls -1 drivers kits

      - name: Read the maintained main fork pin
        id: main
        run: |
          revision=$(cat device/upstream.rev)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "pinned main: $revision"

      - name: Checkout UniXNU main fork
        uses: actions/checkout@v4
        with:
          repository: xiaoan919/UniXNU_Enc3l
          ref: ${{ steps.main.outputs.revision }}
          path: main
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host tools and check the SDK
        run: |
          brew install cmake ninja unifdef llvm mtools openssl@3 dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Resolve profiles and fetch pinned sources
        working-directory: main
        run: |
          # Drivers and kits live inside the device repository for this port,
          # so point the driver at them explicitly instead of relying on a
          # modules/ submodule checkout.
          ./unixnu defconfig ace6_defconfig -D ../device \
            --local-drivers ../device/drivers \
            --local-kits ../device/kits
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily \
            --local-drivers ../device/drivers \
            --local-kits ../device/kits
          ./unixnu tree \
            --local-drivers ../device/drivers \
            --local-kits ../device/kits
          OUTPUT="$PWD/out/ace6/ipados-17.7.11-21H461/ace6"
          mkdir -p "$OUTPUT/logs"
          echo "UNIXNU_OUTDIR=$OUTPUT" >> "$GITHUB_ENV"
          echo "UNIXNU_TREE=$OUTPUT/tree" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/scripts" >> "$GITHUB_ENV"
          echo "UNIXNU_LOCAL=--local-drivers ../device/drivers --local-kits ../device/kits" >> "$GITHUB_ENV"
          ./unixnu status --json -D ../device \
            --local-drivers ../device/drivers \
            --local-kits ../device/kits > "$OUTPUT/status.json"
          cp ../device/unixnu.lock "$OUTPUT/unixnu.lock" 2>/dev/null || true

      - name: Check configuration and production contracts
        if: ${{ !inputs.skip_tests }}
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ../device/scripts/test-format2.py --device ../device
          python3 scripts/porting-record.py check --device ../device || true
          python3 ../device/scripts/test-kernel-source.py
          python3 ../device/scripts/test-bootimg.py
          python3 ../device/scripts/test-stage6.py --tree "$UNIXNU_TREE" --openssl-prefix "$(brew --prefix openssl@3)"
          ASAN_OPTIONS=detect_leaks=0 python3 ../device/scripts/test-stage7.py --tree "$UNIXNU_TREE"
          ASAN_OPTIONS=detect_leaks=0 python3 ../device/scripts/test-peripherals.py --tree "$UNIXNU_TREE"
          python3 ../device/scripts/test-ram-data.py
          python3 ../device/scripts/test-root-audit.py --tree "$UNIXNU_TREE"

      - name: Prepare original ABI inputs, trust and root-window policies
        working-directory: main
        run: |
          ./unixnu ipsw fetch AppleLogo KernelCache OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee "$UNIXNU_OUTDIR/logs/actions-ipsw.log"
          python3 "$UNIXNU_TREE/scripts/audit-stage7-display.py" out/ipsw/21H461/kernelcache.decompressed
          python3 ../device/scripts/prepare-ufs-policies.py --tree "$UNIXNU_TREE" \
            --inputs out/ipsw/21H461 --openssl-prefix "$(brew --prefix openssl@3)" \
            2>&1 | tee "$UNIXNU_OUTDIR/logs/actions-policies.log"
          python3 ../device/scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" \
            --inputs out/ipsw/21H461 --output "$UNIXNU_OUTDIR/original-static-system.bundle" \
            2>&1 | tee "$UNIXNU_OUTDIR/logs/actions-trust.log"

      - name: Prepare volatile Data from the original var tree
        working-directory: main
        run: |
          sudo "$(command -v python3)" ../device/scripts/prepare-ram-data.py --tree "$UNIXNU_TREE" \
            --source out/ipsw/21H461/044-76040-038.dmg --systemos out/ipsw/21H461/044-76034-038.dmg \
            --output "$UNIXNU_OUTDIR/ram-data" --config "$UNIXNU_OUTDIR/.config" \
            2>&1 | tee "$UNIXNU_OUTDIR/logs/actions-ram-data.log"

      - name: Build XNU and prelink
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu kernel -j 3 \
            --local-drivers ../device/drivers \
            --local-kits ../device/kits \
            2>&1 | tee "$UNIXNU_OUTDIR/logs/actions-build.log"

      - name: Upload kernel and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace6-format2-${{ github.run_number }}
          path: |
            main/out/ace6/ipados-17.7.11-21H461/ace6/kernel/**
            main/out/ace6/ipados-17.7.11-21H461/ace6/logs/**
            main/out/ace6/ipados-17.7.11-21H461/ace6/status.json
            main/out/ace6/ipados-17.7.11-21H461/ace6/unixnu.lock
            main/out/ace6/ipados-17.7.11-21H461/ace6/ram-data/**
            main/out/ace6/ipados-17.7.11-21H461/ace6/original-static-system.bundle
          if-no-files-found: warn
          retention-days: 7
