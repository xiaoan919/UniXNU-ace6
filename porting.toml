[[area]]
id = "packaging"
status = "planned"
components = ["NativePrelink", "PaganiVerifiedRoot", "NativeAES", "NativeKeyStoreEvents"]
paths = ["board.toml", "upstream.rev"]
inputs = ["Apple kernelcache from iPadOS 17.7.11 21H461, 46415872 bytes after decoding."]
configuration = ["kernel.prelink tool kits/NativePrelink/emit_prelink.py; slide -0x1000000.", "kernelcache_sha256 f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7."]
procedure = ["Fetch the IPSW and decode the kernelcache: strip the IM4P DER wrapper, decompress the bvx2 LZFSE payload, take the arm64 slice and check the sha256 against the pin.", "Run the prelink tool against the decoded kernelcache.", "Assemble the payload volume and the boot image, then verify the readback."]
findings = ["The kernelcache decodes to a 46 MB Mach-O whose sha256 matches the pin, so every hardcoded slot and vtable offset in the drivers was read against this exact image.", "mkbootimg.py writes ramdisk_size 0 for a v4 image even when --ramdisk is given, so the boot image has to be packed by hand.", "The ADT is generated from the device tree and needs the OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, which comes from Apple's image rather than the board."]
completion = ["kernel.macho is produced and the payload assembles and verifies."]
limits = ["No kernel has linked yet, so no kernel.macho exists."]
next_action = ["Reach the kernel build step."]

[[area]]
id = "diagnostics"
status = "planned"
components = ["BootProgress", "Stage7Probe"]
paths = ["patches/**", "docs/touch-bringup.md"]
inputs = ["BootProgress peripheral status, Stage7Probe peripheral bring-up."]
configuration = ["pagani-platform-status and pagani-peripheral-status boot arguments.", "Early boot progress patches add the progress hooks to start.s, vm_init.c and the panic paths."]
procedure = ["Apply the early progress patches and confirm start.s carries the secondary and exception-vector progress hooks.", "Boot and read the platform status overlay below the camera cutout.", "For touch, read the SPI and TOUCH rows; for keys, read the PMIC sample row."]
findings = ["The stage-7 probe registers the input and panel static initialisers by their __GLOBAL__sub_I_ symbol names, and those names must match the renamed source files or the constructors never run.", "The device patch series was empty, so none of the progress hooks existed. That is a missing capability, not only a failing check."]
completion = ["Logs reach a readable transport during bring-up."]
limits = ["No kernel log has been captured from this device; only the UEFI firmware serial output has been seen."]
next_action = ["Capture the first kernel log once it links."]

