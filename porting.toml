schema_version = 1

[device]
name = "ace6"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus Ace 6 PLQ110: hardware reconnaissance complete and the UEFI firmware boots on the unit to the UniXNU menu. The kernel has not linked yet, so every area that depends on XNU stays planned."

# 本记录只反映真实状态。任何 area 在真机出现可复现结果之前都保持 planned；
# status 只在有对应证据时才升级。

[[area]]
id = "configuration"
status = "host-verified"
components = ["PaganiArmDTPlatform", "PaganiArmCpu", "Sm8750Platform", "QcomGeniSpi"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "package/PaganiPeripherals.h", "patches/**", "scripts/**", "upstream.rev", "modules/**"]
inputs = ["SM8750 Sun v1 (soc_id 618 / 0x26a, board-id 0x50008), iPadOS 17.7.11 21H461.", "Drivers and kits from xiaoan919/UniXNU-Pagani-Drivers 2ba63b1, UniXNU/QcomGeniSpi eac47ba and IssacL04/UniXNU-sm8750-common b79d675."]
configuration = ["schema_version=2; soc_source=sm8750; defconfig ace6_defconfig; 17 components selected.", "Drivers and kits are submodules under modules/, linked into drivers/ and kits/ by the workflow before use, so each component resolves to a git HEAD that matches the revision pinned in components.toml."]
procedure = ["Clone this repository with submodules: git clone --recurse-submodules.", "From the UniXNU tree run ./unixnu defconfig ace6_defconfig -D ../UniXNU-ace6 --local-drivers ../device/drivers --local-kits ../device/kits.", "Run ./unixnu status --json -D ../UniXNU-ace6 and compare the resolved components, sources and patch order against components.toml.", "Run the device checks: test-format2.py, test-kernel-source.py, test-bootimg.py, test-stage6.py, test-stage7.py, test-peripherals.py, test-ram-data.py and test-root-audit.py."]
findings = ["Board identity read from the runtime device tree: model \"Qualcomm Technologies, Inc. Sun MTP,ktm-g_ti\", compatible qcom,sun-mtp/qcom,sun/qcom,sunp-mtp/qcom,sunp/qcom,mtp. oplus project 0x6113 = 24851 matches oplusboot.prjname and the touch node's platform_support_project.", "The drivers were plain files committed into this repository, so the configuration check read this repository's HEAD instead of the pinned driver revision and could never pass. They are submodules now.", "components.toml did not carry each component's path into its source, so fetch cloned the repository root and a patch entry like component:NativePrelink/patches/x.patch resolved to <repo-root>/patches/x.patch.", "The Ace 6 device tree declares two non-contiguous DRAM windows; the ADT step rejected any board with more than one memory node.", "root_match_volume_uuid was all zeros, which matches no volume, so the kernel would never have found its root."]
completion = ["defconfig resolves; every selected component has a source; status reports the intended overrides and patch order; the device checks pass."]
limits = ["The checks have not all run green in one pass yet. Component sources live in modules/ and the workflow links them into drivers/ and kits/; local runs must do the same or point --local-module at each submodule path."]
next_action = ["Get one complete pass of the configuration checks, then reach the kernel build."]

[[area.evidence]]
kind = "host"
reference = "docs/hardware.md"
command = "unixnu defconfig ace6_defconfig and the eight device checks (test-format2, test-kernel-source, test-bootimg, test-stage6, test-stage7, test-peripherals, test-ram-data, test-root-audit)"
revision = "7570279b5efe26238dd8a79339291c43548fdbe1"
result = "defconfig resolves 17 components from three submodules; components.toml pins match each module HEAD; the ADT generator accepts the board's two DRAM windows and emits the OS volume UUID."


[[area]]
id = "firmware"
status = "device-verified"
components = ["PaganiDarwinBoot"]
paths = ["uefi/**", "docs/firmware.md", "board.toml"]
inputs = ["UEFI firmware built from the XNU Mu-Silicium package, FD at 0xA7000000 size 0x300000.", "Ace6 framebuffer 1272x2800 at splash_region 0xfc800000, 0x2b00000 bytes.", "Ace6 DXE heap 0x16ac3000 bytes."]
configuration = ["ACE6_VENDOR_HW=0 and ACE6_SMBIOS=0: the prebuilt pagani driver set is gated out and the Mu drivers only are used.", "SimpleFbDxe publishes a GOP on the frame buffer the bootloader leaves scanning out; USE_CUSTOM_DISPLAY_DRIVER=0.", "Each module is listed in exactly one of ace6.fdf, Include/DXE.inc and Include/APRIORI.inc, because GenFv refuses a volume carrying one file GUID twice."]
procedure = ["Build the volume: build_uefi.py -d ace6 -r DEBUG -c -m 0, which writes Build/ace6Pkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd.", "Assemble a boot image carrying gzip(BootShim + FD) in the kernel field and the device tree appended.", "Load it without writing any partition: fastboot boot Mu-ace6.img.", "Observe the panel: the Project Silicium mark, then the UniXNU menu with the board's own panel and resolution."]
findings = ["The FD base is 0xA7000000, not the 0xA7100000 used by the reference ports: the uefi_b partition is 5 MiB and the ELF program header loads at 0xA7000000 with filesz 0x2A8000.", "The prebuilt pagani drivers assume the reference board's device paths, so each one stops the boot where it runs: EnvDxeEnhanced asserts in SerialDxe.c:849, XhciDxe in Autogen.c:284, SmbiosDxe in Autogen.c:384 and SPMIDxe the same way. Gating the whole vendor block is what moved the boot from four drivers to thirteen and then into the menu.", "The menu cursor walked on its own because SimpleTextInOutSerial published a text input with no UART behind it; removing it leaves the menu reporting \"No input device\" and booting the default entry on the timer.", "GenFv reported \"the 32th file and 94th file have the same file GUID\" and later the same for UniXNU's own GUID, because ace6.fdf includes DXE.inc and APRIORI.inc and modules were listed in more than one of them."]
completion = ["The firmware boots on the unit and reaches the UniXNU menu without flashing any partition."]
limits = ["No key driver exists in the volume, so the menu cannot be driven by the volume and power keys. Volume (input) is a kernel driver and does not run in UEFI. The payload volume is not found: the menu still reports built-in configuration and drivers 0 loaded."]
next_action = ["Add a UEFI key driver that samples PON and GPIO, or find why the bootloader does not hand the ramdisk to the firmware."]

[[area.evidence]]
kind = "device"
reference = "uefi/ace6Pkg/ace6.fdf"
command = "fastboot boot Mu-ace6.img"
revision = "7570279b5efe26238dd8a79339291c43548fdbe1"
result = "Panel shows the Project Silicium mark and then the UniXNU menu at 1272x2800 with four built-in entries. The footer reports drivers 0 loaded / 0 failed, kits 0, acpi 0 and \"No input device: the default entry boots when the timer ends\". Selecting an entry ends at \"Failed to Find an Operating System\" because no payload volume is reachable."


[[area]]
id = "cpu"
status = "planned"
components = ["PaganiArmCpu"]
paths = ["package/PaganiPeripherals.h", "patches/**"]
inputs = ["8 cores: cluster0 cpu0-cpu5 (phandles 0x10-0x15), cluster1 cpu6-cpu7 (0x16-0x17)."]
configuration = ["cpu-map taken from the runtime DT; MAX_CPUS 8 and MAX_CPU_CLUSTERS 2 in the board config."]
procedure = ["Apply the device patch series so start.s carries the secondary progress hooks and the eight affinities.", "Build the kernel and boot it.", "Read the CPU state from the boot arguments and the platform status overlay."]
findings = ["Measured max frequencies cpu0/2/4 = 3532800 kHz, cpu6/7 = 4320000 kHz. soc0/platform_version = 65536.", "The reference port records a scheduler ticket-lock panic on MPIDR affinity 0x200 when more than one core came online before the lock policy was corrected; nothing here has run yet."]
completion = ["All eight cores come online under XNU."]
