next_action = ["Verify after the first successful kernel link."]

[[area]]
id = "memory"
status = "planned"
components = ["NativeRamBlock"]
paths = ["package/PaganiPeripherals.h", "dts/**"]
inputs = ["16-segment memory map totaling 11426.7 MiB; MemTotal 11384616 kB.", "64 reserved-memory regions totaling 1305.5 MiB."]
configuration = ["dram_size 0x300000000 (12 GiB); owned window 0x100000000 (4 GiB) retained until requalified.", "Two declared windows: 0x980000000+0x180000000 and 0x8c0000000+0x0c0000000."]
procedure = ["Decompile dts/ace6.dts with dtc and confirm the memory nodes.", "Run the ADT generator and confirm dram-base, dram-size and darwinboot-memory-size in /device-tree/chosen.", "Boot and read the platform status overlay for the RAM figure."]
findings = ["The 0x980000000/6 GiB segment is byte-identical to the reference port's DTS node. The second window at 0x8c0000000 (3 GiB) has no counterpart there, which is why the ADT step rejected the board until it stopped requiring exactly one memory node.", "payload.dram_size is the physical total (12 GiB) while the first window is 6 GiB; the old check demanded equality and could never hold.", "gpu_microcode_region is only 0x2000 (8 KiB) although gen80000_zap.mbn is 12088 bytes; the ELF program headers show the code segment starts at 0x1000 and is 0x3b4 bytes, so it fits, but ph[2] memsz 0xf38 is unverified."]
completion = ["DarwinBoot allocates and the kernel sees the intended window."]
limits = ["Not booted."]
next_action = ["Confirm the ZAP region size before enabling GPU work."]

[[area]]
id = "storage"
status = "planned"
components = ["NativeUfs", "NativeVirtioBlock"]
paths = ["board.toml", "package/PaganiPeripherals.h"]
inputs = ["ufshc@1d84000, iommus <&apps_smmu 0x60 0>, 2 lanes, IRQ 265, reset GPIO 215."]
configuration = ["GPT uses 4096-byte logical sectors; userdata entry 15 spans LBA 4602604..61655034 (217.64 GiB).", "CONFIG_XNU_NATIVE_UFS=y with the root partition named unixnu."]
procedure = ["Confirm the userdata extent against this unit's GPT before assembling any image.", "Build the UFS bindings against the pinned kernelcache, then the archive.", "Boot and mount the data volume read-only."]
findings = ["143 partitions under /dev/block/by-name. Current slot _b. The reference port's userdata LBAs (44928768..61705983) belong to a 64 GiB unit and must not be reused here.", "build-native-ufs.py reads compile records the kernel build leaves behind, so it cannot run before the kernel has been configured once."]
completion = ["Kernel mounts the data volume read-only."]
limits = ["Not booted. The userdata image has not been built; that step needs a Linux or macOS host."]
next_action = ["Build the userdata image on a Linux host once the kernel links."]

[[area]]
id = "display"
status = "planned"
components = ["PaganiPanel", "NativeMobileDisplay"]
paths = ["package/PaganiPeripherals.h", "patches/**"]
inputs = ["AA605_P_7_A0020 (tianma), 1272x2800, DSI cmd mode, 4 lane."]
configuration = ["Timings measured from dtbo overlay 00: hfp/hbp/hpw 26/26/2, vfp/vbp/vpw 56/24/2, clock 0x41fb7ac0 at 120 Hz and 0x5140c800 at 144 Hz, bpp 30.", "DSC v18, bpp 8, bpc 10, slice 636x20, 2 encoders."]
procedure = ["Build the legacy display archive with the pinned kernelcache so the ABI checks run.", "Boot and look for the display handoff rows in the platform status overlay.", "Confirm the panel leaves the bootloader's frame into the kernel's scanout."]
findings = ["Panel node is qcom,mdss_dsi_panel_AA605_P_7_A0020_dsc_cmd; bootargs carry PanelID 0x009A0501 and PanelSN 0x0E09170F13171008. A stale platform_support_project_commandline in the touch node still names P_3; the live node is P_7 and P_3 does not exist.", "In UEFI the panel is already driven: SimpleFbDxe publishes a GOP and the UniXNU menu renders at 1272x2800. That is the firmware path, not this kernel driver."]
completion = ["A known image renders on the panel from the kernel."]
limits = ["PaganiPanel only drives DCS 0x51 brightness and 0x28/0x29 blanking. The DCS init sequence for AA605 is still inside the stock kernel and has not been extracted."]
next_action = ["Extract the AA605 init sequence from the vendor kernel."]

[[area]]
id = "input"
status = "planned"
components = ["PaganiInput"]
paths = ["package/PaganiPeripherals.h", "docs/touch-bringup.md"]
inputs = ["Synaptics S3910 on qupv3_se4_spi at 0xA90000, IRQ 357, 19 MHz, tx-rx 18x40, resolution 20352x44800."]
configuration = ["tlmm pins 48/49/50/51 plus reset 161 and attn 162; drive strength measured {6,4,6,4,3,3}.", "Power is a single fixed 1.8 V L4B rail; the reference port's dual RPMh VRM path does not apply."]
procedure = ["Confirm the node that is actually enabled: the synaptics,tcm-spi-hbp child of qupv3_se4_spi is status disabled and is served by hbp_spi@0 (oplus,hbp_spi_bus) instead.", "Boot with pagani-touch-sid set to sweep candidate SMMU SIDs, because no SPI node on this SoC declares iommus.", "Read the platform status rows: SPI fw/if/st/irq, then TOUCH T<n> <command> <stage>, then HID b/use/ev and XY in/out/mask."]
findings = ["No SPI node on this SoC declares iommus, so the bypass SID is not in the device tree and is probed at runtime. PaganiInput.cpp carries that adaptation: pagani_touch_smmu_sid() reads the pagani-touch-sid boot argument and falls back to PAGANI_TOUCH_SMMU_SID, and smmuActive records whether a translation context was actually programmed.", "The reference port's own record shows the S3910 producing valid protocol and contact frames through SE DMA (build 56: header a5 10 1c 00, HID report r=0, nonzero contact mask on press and zero on release), with swipes and a power-menu Cancel tap still unresponsive. That is the reference hardware, not this board."]
completion = ["Touch produces HID reports and the lock screen responds."]
limits = ["Never compiled against XNU for this board. GPI DMA, v1 command fragmentation, firmware recovery and HID hot-unplug are not implemented upstream either."]
next_action = ["Determine the real SMMU SID on hardware as described in docs/touch-bringup.md."]

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/PaganiPeripherals.h"]
inputs = ["Adreno830v2, chipid 0x44050001, GMU 0x3d37000, HFI IRQ 304, GPU SMMU 0x3da0000 with 49-bit IOVA."]
configuration = ["CONFIG_XNU_NATIVE_ADRENO is not set; software rendering only."]
procedure = ["Capture the KGSL module from the running Android build.", "Compare the gen7_* and gen8_* implementations that the module contains.", "Decide whether the shader compiler can be reached through its SPIR-V input path before writing any driver."]
findings = ["msm_kgsl.ko contains both gen7_* and gen8_* implementations: 223 of 234 names are shared and 174 have under 10% size difference, so A830 is an evolution of A740 rather than a rewrite. gen8 adds 11 functions including acquire_cp_semaphore and cx_host_irq_handler.", "The shader compiler is not in vulkan.adreno.so; it is libllvm-qgl.so (21.5 MB), backend name Oxili, compiler version E031.47.18.51 built for product sun. 672 llvm.qgpu.* intrinsics were exported. The compiler exposes a native SPIR-V input path; input dispatch is in HighLevelCompiler/lib/LA/gl_core/ContextImpl.cpp line 441."]
completion = ["GPU submissions complete and a known frame reaches scanout."]
limits = ["No driver exists. All 28056 function names in libllvm-qgl.so are symbol-stubbed, so code must be located by string cross-reference."]
next_action = ["Validate the SPIR-V route before writing any GPU code."]

